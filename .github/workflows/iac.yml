name: Worker infrastructure
on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [bootstrap, apply, verify]
        required: true
permissions:
  contents: read
concurrency:
  group: apex-delivery
  cancel-in-progress: false
jobs:
  iac:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: apex-operations
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.3
          terraform_wrapper: false
      - name: Run Terraform with standard state and locking
        shell: bash
        env:
          OPERATION: ${{ inputs.operation }}
          GH_TOKEN: ${{ secrets.IAC_GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.IAC_GITHUB_TOKEN }}
          CONTROL_READ_TOKEN: ${{ secrets.CONTROL_READ_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_IAC_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          TF_INPUT: 'false'
          TF_IN_AUTOMATION: 'true'
          TF_WORKSPACE: default
        run: |
          set -euo pipefail
          case "$OPERATION" in bootstrap|apply|verify) ;; *) exit 1 ;; esac
          source .github/scripts/guard.sh
          umask 077
          export TF_DATA_DIR="$RUNNER_TEMP/apex-data"
          PRIVATE_DIR="$RUNNER_TEMP/apex-private"
          mkdir -p "$PRIVATE_DIR"
          : "${CLOUDFLARE_API_TOKEN:?}" "${AWS_ACCESS_KEY_ID:?}" "${AWS_SECRET_ACCESS_KEY:?}" "${GITHUB_TOKEN:?}"
          latest_main
          if [[ "$OPERATION" == bootstrap ]]; then require_bootstrap; else require_open; worker_json >/dev/null; fi
          export TF_VAR_protected_policy_id
          TF_VAR_protected_policy_id=$(gh api "repos/$REPOSITORY/environments/apex-operations/deployment-branch-policies" | jq -er '.branch_policies | select(length == 1 and .[0].name == "main" and .[0].type == "branch") | .[0].id')
          terraform -chdir=terraform/apex init -reconfigure -lockfile=readonly > "$PRIVATE_DIR/init.log" 2>&1 || { echo 'Terraform init failed; diagnostics are private.'; exit 1; }
          code=0
          terraform -chdir=terraform/apex plan -detailed-exitcode -out="$PRIVATE_DIR/plan" > "$PRIVATE_DIR/plan.log" 2>&1 || code=$?
          case "$code" in
            0) echo 'Terraform plan: no changes.' ;;
            2) echo 'Terraform plan: changes present.' ;;
            *) echo 'Terraform plan failed; diagnostics are private.'; exit "$code" ;;
          esac
          if [[ "$OPERATION" == verify ]]; then
            test "$code" = 0
          else
            latest_main
            if [[ "$OPERATION" == bootstrap ]]; then require_bootstrap; else require_open; worker_json >/dev/null; fi
            terraform -chdir=terraform/apex apply "$PRIVATE_DIR/plan" > "$PRIVATE_DIR/apply.log" 2>&1 || { echo 'Terraform apply failed; diagnostics are private.'; exit 1; }
            echo 'Terraform apply completed.'
          fi

name: Verify

on:
  pull_request:
  push:
    branches: [main]

  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [check, format, lock]
        default: check
permissions:
  contents: read

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ github.event_name == 'workflow_dispatch' && 'terraform-maintenance' || 'verify' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.11
      - name: Locate pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml', 'pnpm-lock.yaml', 'pnpm-workspace.yaml') }}
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.3
          terraform_wrapper: false
      - name: Check tool versions
        run: |
          test "$(node --version)" = "v$(jq -r .engines.node package.json)"
          test "$(pnpm --version)" = "$(jq -r .engines.pnpm package.json)"
      - run: bash .github/tests/operations.sh
      - run: bash .github/tests/approve.sh
      - run: bash .github/tests/artifact.sh
      - run: bash .github/tests/pr-source.sh
      - run: shellcheck .github/scripts/*.sh .github/tests/*.sh
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run check
      - run: pnpm test
      - if: inputs.operation == 'format'
        run: terraform fmt -recursive
      - if: inputs.operation == 'lock'
        run: terraform -chdir=terraform/apex providers lock -platform=linux_amd64
      - if: inputs.operation == 'format' || inputs.operation == 'lock'
        run: git diff -- terraform > "$RUNNER_TEMP/terraform-maintenance.patch"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: inputs.operation == 'format' || inputs.operation == 'lock'
        with:
          name: terraform-maintenance
          path: ${{ runner.temp }}/terraform-maintenance.patch
          retention-days: 7
      - run: terraform fmt -check -recursive
      - run: terraform -chdir=terraform/apex init -backend=false -lockfile=readonly
      - run: terraform -chdir=terraform/apex validate
      - run: terraform -chdir=terraform/apex test
      - run: bash .github/scripts/artifact.sh pack
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'pull_request'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'pull_request'
        with:
          name: verified-site
          path: |
            site.tar
            manifest.json
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: browser-test-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

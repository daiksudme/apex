name: cloudflare-builds

on:
  push:
    branches: [main]
    paths:
      - cloudflare-builds.json
      - wrangler.jsonc
      - scripts/cloudflare/**
      - .github/workflows/cloudflare-builds.yml
      - package.json
      - mise.toml
      - mise.lock
  workflow_dispatch:
    inputs:
      mode:
        description: Inspect or apply the declared Workers Builds configuration
        type: choice
        options: [plan, apply]
        default: plan
        required: true

permissions: {}
defaults:
  run:
    shell: bash
concurrency:
  group: cloudflare-builds
  cancel-in-progress: false

jobs:
  cloudflare-builds:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: install tools
        uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          cache: false
      - name: Synchronize Workers Builds configuration
        env:
          MODE: ${{ inputs.mode || 'apply' }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_BUILDS_API_TOKEN }}
        run: bun scripts/cloudflare/builds.mjs "$MODE"

name: ci-pr

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions: {}
defaults:
  run:
    shell: bash
concurrency:
  group: ci-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  draft:
    runs-on: ubuntu-slim
    timeout-minutes: 3
    permissions: {contents: write, pull-requests: write}
    env: &pr-env
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - run: gh pr ready "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --undo

  commit-stage:
    needs: draft
    runs-on: ubuntu-slim
    timeout-minutes: 15
    permissions:
      contents: read
      checks: read
      deployments: read
    outputs:
      preview-url: ${{ steps.validation.outputs.preview-url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/commit-stage
        id: validation
        with:
          preview: 'true'
          source-sha: ${{ github.event.pull_request.head.sha }}
          source-branch: ${{ github.event.pull_request.head.ref }}

  ready:
    needs: commit-stage
    runs-on: ubuntu-slim
    timeout-minutes: 3
    permissions: {contents: write, pull-requests: write}
    env: *pr-env
    steps:
      - run: gh pr ready "$PR_NUMBER" --repo "$GITHUB_REPOSITORY"

  acceptance-stage:
    needs: [commit-stage, ready]
    runs-on: ubuntu-slim
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/acceptance-stage
        with:
          preview: 'true'
          preview-url: ${{ needs['commit-stage'].outputs.preview-url }}

  pass:
    needs: acceptance-stage
    if: always()
    runs-on: ubuntu-slim
    timeout-minutes: 3
    permissions: {}
    steps:
      - name: Reject failed or cancelled validation
        if: cancelled() || needs['acceptance-stage'].result != 'success'
        run: exit 1

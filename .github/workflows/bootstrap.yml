name: Bootstrap Worker

on:
  workflow_dispatch:
    inputs:
      verification_run:
        description: Successful latest-main Verify run ID
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: apex-delivery
  cancel-in-progress: false

jobs:
  bootstrap:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: apex-operations
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.11
      - run: pnpm install --frozen-lockfile
      - name: Create the initial Worker from a verified artifact
        run: bash .github/scripts/publish.sh
        env:
          OPERATION: bootstrap
          VERIFY_RUN_ID: ${{ inputs.verification_run }}
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_BOOTSTRAP_TOKEN }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: delivery-receipt
          path: .delivery/receipt.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

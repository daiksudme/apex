name: Initial delivery control
on:
  workflow_dispatch:
    inputs:
      verification_run:
        description: Successful latest-main Verify run ID
        type: string
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: apex-delivery
  cancel-in-progress: false
jobs:
  initial-thaw:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: apex-operations
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - run: bash .github/scripts/thaw.sh
        env:
          VERIFY_RUN_ID: ${{ inputs.verification_run }}
          GH_TOKEN: ${{ github.token }}
          CONTROL_READ_TOKEN: ${{ secrets.CONTROL_READ_TOKEN }}
          CONTROL_WRITE_TOKEN: ${{ secrets.CONTROL_WRITE_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN }}

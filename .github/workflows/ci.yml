name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main

permissions: {}

defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.head.repo.fork &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-slim
    timeout-minutes: 3
    permissions:
      actions: read
      pull-requests: write
    steps:
      - name: start validation in draft
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          MODE: draft
        with:
          script: &state-script |
            const source = context.payload.pull_request;
            const repo = `${context.repo.owner}/${context.repo.repo}`;
            if (context.eventName !== 'pull_request' || source?.head?.repo?.full_name !== repo
              || source.head.repo.fork || source.user.login === 'dependabot[bot]' || context.actor === 'dependabot[bot]') {
              throw new Error('Unsupported automatic PR lifecycle');
            }
            const attempt = Number(process.env.GITHUB_RUN_ATTEMPT);
            const current = async () => {
              const { data: pr } = await github.rest.pulls.get({ ...context.repo, pull_number: source.number });
              const { data: run } = await github.rest.actions.getWorkflowRun({ ...context.repo, run_id: context.runId });
              const { data: latest } = await github.rest.actions.listWorkflowRuns({
                ...context.repo, workflow_id: run.workflow_id, event: 'pull_request', branch: source.head.ref, per_page: 1,
              });
              if (pr.state !== 'open' || pr.head.sha !== source.head.sha || pr.head.ref !== source.head.ref
                || run.id !== context.runId || run.run_attempt !== attempt || run.head_sha !== source.head.sha
                || run.head_branch !== source.head.ref || run.event !== 'pull_request' || run.status !== 'in_progress'
                || latest.workflow_runs[0]?.id !== context.runId || latest.workflow_runs[0]?.run_attempt !== attempt) {
                throw new Error('Obsolete PR source, run, or attempt');
              }
              return pr;
            };
            let pr = await current();
            const mode = process.env.MODE;
            if (!['draft', 'ready', 'reconcile'].includes(mode)) throw new Error('Unsupported lifecycle state operation');
            let draft = mode === 'draft';
            let inconsistent = false;
            if (mode !== 'draft') {
              const needs = JSON.parse(process.env.NEEDS_RESULTS);
              const { data } = await github.rest.actions.listJobsForWorkflowRunAttempt({
                ...context.repo, run_id: context.runId, attempt_number: attempt, per_page: 100,
              });
              const successful = (name) => {
                const jobs = data.jobs.filter((job) => job.name === name);
                return jobs.length === 1 && jobs[0].status === 'completed' && jobs[0].conclusion === 'success'
                  && jobs[0].run_id === context.runId && jobs[0].head_sha === source.head.sha;
              };
              if (mode === 'ready') {
                if (needs.prepare?.result !== 'success' || needs['commit-stage']?.result !== 'success' || !successful('commit-stage')) {
                  throw new Error('Commit stage did not complete successfully for this attempt');
                }
                const { data: run } = await github.rest.actions.getWorkflowRun({ ...context.repo, run_id: context.runId });
                const commit = data.jobs.find((job) => job.name === 'commit-stage');
                const prepare = data.jobs.find((job) => job.name === 'prepare');
                const duration = (start, end) => Date.parse(end) - Date.parse(start);
                const elapsed = duration(run.created_at, commit.completed_at);
                const commitTime = duration(commit.started_at, commit.completed_at);
                const draftTime = duration(prepare?.started_at, prepare?.completed_at);
                const waiting = commit.steps?.find((step) => step.name === 'wait for matched Preview');
                const providerTime = duration(waiting?.started_at, waiting?.completed_at);
                const runnerTime = draftTime + commitTime - providerTime;
                const queueTime = elapsed - draftTime - commitTime;
                if (![elapsed, commitTime, draftTime, providerTime, runnerTime, queueTime].every((value) => Number.isFinite(value) && value >= 0)) {
                  core.warning('Commit-stage timing unavailable: native timestamps are missing or inconsistent');
                } else {
                  const seconds = (value) => `${Number((value / 1000).toFixed(1))}s`;
                  const label = attempt === 1 ? 'Commit-stage path' : 'Commit-stage path since workflow creation (includes earlier attempts)';
                  const report = `${label}: ${seconds(elapsed)}; queue/control: ${seconds(queueTime)}; runner execution: ${seconds(runnerTime)}; observed Preview wait: ${seconds(providerTime)}.`;
                  const identity = `Source ${source.head.sha}; run ${context.runId}; attempt ${attempt}.`;
                  await core.summary.addRaw(`${report}\n\n${identity}\n\nPreview wait is observed readiness waiting, not independent provider build duration.\n`).write();
                  if (elapsed > 300_000) {
                    core.warning(`${report} The five-minute improvement target was exceeded; functional validation still passes.`);
                    const marker = `<!-- apex-commit-timing:${source.head.sha}:${context.runId}:${attempt} -->`;
                    let comments;
                    try {
                      comments = await github.paginate(github.rest.issues.listComments, { ...context.repo, issue_number: source.number, per_page: 100 });
                    } catch (error) {
                      core.warning(`Timing notification unavailable: ${error.message}`);
                    }
                    if (comments && !comments.some((comment) => comment.user?.login === 'github-actions[bot]' && comment.body?.includes(marker))) {
                      await current();
                      try {
                        await github.rest.issues.createComment({ ...context.repo, issue_number: source.number,
                          body: `${marker}\n${report}\n\n${identity}\n\nThe five-minute improvement target was exceeded. Functional validation passed and continues to Ready and acceptance. Review test allocation or waiting bottlenecks; elapsed time is not a failure. Preview wait is observed readiness waiting, not independent provider build duration.`,
                        });
                      } catch (error) {
                        core.warning(`Timing notification unavailable: ${error.message}`);
                      }
                    }
                  }
                }
              } else {
                const result = needs['acceptance-stage']?.result;
                if (!['success', 'failure', 'skipped', 'cancelled'].includes(result)) throw new Error('Acceptance stage result is missing');
                const succeeded = ['prepare', 'commit-stage', 'ready', 'acceptance-stage'].every((name) => needs[name]?.result === 'success')
                  && successful('acceptance-stage');
                if (succeeded && pr.draft) throw new Error('Successful acceptance has an unexpected Draft instead of Ready state');
                draft = !succeeded;
                inconsistent = result === 'success' && !succeeded;
              }
            }
            if (pr.draft !== draft) {
              pr = await current();
              const mutation = draft ? 'convertPullRequestToDraft' : 'markPullRequestReadyForReview';
              await github.graphql(`mutation($id: ID!) { ${mutation}(input: {pullRequestId: $id}) { pullRequest { id } } }`, { id: pr.node_id });
            }
            pr = await current();
            if (pr.draft !== draft) throw new Error('Requested PR state was not confirmed');
            if (inconsistent) throw new Error('Acceptance stage result was not confirmed');

  commit-stage:
    name: commit-stage
    needs: prepare
    if: always() && (github.event_name == 'push' || needs.prepare.result == 'success')
    runs-on: ubuntu-slim
    timeout-minutes: 15
    permissions:
      contents: read
      checks: read
      deployments: read
    outputs:
      preview-url: ${{ steps.preview.outputs.url }}
      source-sha: ${{ steps.source.outputs.sha }}
      checkout-sha: ${{ steps.source.outputs.checkout }}
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: record source and checkout
        id: source
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          printf 'sha=%s\n' "$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          printf 'checkout=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: install tools
        uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          cache: false
      - name: install dependencies
        run: pnpm install --frozen-lockfile
      - name: check
        run: pnpm check
      - name: build
        run: pnpm build
      - name: fast tests
        run: pnpm test:unit
      - name: CI helper tests
        run: pnpm test:ci
      - name: wait for matched Preview
        id: preview
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
          SOURCE_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          node scripts/ci/preview.mjs "$SOURCE_SHA" "$SOURCE_BRANCH" > preview-evidence.json
          cat preview-evidence.json
          jq -er '"url=" + .previewUrl' preview-evidence.json >> "$GITHUB_OUTPUT"
      - name: root HTTP smoke
        if: github.event_name == 'pull_request'
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
        run: pnpm test:smoke "$PREVIEW_URL"

  ready:
    needs: [prepare, commit-stage]
    if: github.event_name == 'pull_request' && needs['commit-stage'].result == 'success'
    runs-on: ubuntu-slim
    timeout-minutes: 3
    permissions:
      actions: read
      pull-requests: write
    steps:
      - name: promote current validation
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          MODE: ready
          NEEDS_RESULTS: ${{ toJSON(needs) }}
        with:
          script: *state-script

  acceptance-stage:
    needs: [commit-stage, ready]
    if: always() && needs['commit-stage'].result == 'success' && (github.event_name == 'push' || needs.ready.result == 'success')
    runs-on: ubuntu-slim
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install tools
        uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          cache: false
      - name: install dependencies
        run: pnpm install --frozen-lockfile
      - name: install Chromium
        run: pnpm exec playwright install --with-deps --only-shell chromium
      - name: PR acceptance
        if: github.event_name == 'pull_request'
        env:
          PREVIEW_URL: ${{ needs['commit-stage'].outputs.preview-url }}
        run: |
          test -n "$PREVIEW_URL"
          pnpm test:acceptance "$PREVIEW_URL"
      - name: main acceptance
        if: github.event_name == 'push'
        run: pnpm test:acceptance
      - name: retain acceptance diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/acceptance
          retention-days: 7
          if-no-files-found: ignore

  reconcile:
    needs: [prepare, commit-stage, ready, acceptance-stage]
    if: >-
      always() && github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.head.repo.fork &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-slim
    timeout-minutes: 3
    permissions:
      actions: read
      pull-requests: write
    steps:
      - name: reconcile terminal validation
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          MODE: reconcile
          NEEDS_RESULTS: ${{ toJSON(needs) }}
        with:
          script: *state-script

  ci:
    name: ci
    needs: [prepare, commit-stage, ready, acceptance-stage, reconcile]
    if: always()
    runs-on: ubuntu-slim
    timeout-minutes: 3
    permissions:
      actions: read
      contents: read
      pull-requests: read
    steps:
      - name: require complete current validation
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          NEEDS_RESULTS: ${{ toJSON(needs) }}
        with:
          script: |
            const source = context.payload.pull_request;
            const main = context.eventName === 'push' && context.ref === 'refs/heads/main';
            const repo = `${context.repo.owner}/${context.repo.repo}`;
            if (!main && (context.eventName !== 'pull_request' || source?.head?.repo?.full_name !== repo
              || source.head.repo.fork || source.user.login === 'dependabot[bot]' || context.actor === 'dependabot[bot]')) {
              throw new Error('Unsupported automatic PR lifecycle');
            }
            const needs = JSON.parse(process.env.NEEDS_RESULTS);
            const names = ['prepare', 'commit-stage', 'ready', 'acceptance-stage', 'reconcile'];
            const applicable = names.filter((name) => !main || !['prepare', 'ready', 'reconcile'].includes(name));
            for (const name of names) {
              const expected = applicable.includes(name) ? 'success' : 'skipped';
              if (needs[name]?.result !== expected) throw new Error(`Required validation ${name} is not ${expected}`);
            }
            const sha = main ? context.sha : source.head.sha;
            const branch = main ? 'main' : source.head.ref;
            const attempt = Number(process.env.GITHUB_RUN_ATTEMPT);
            const { data: run } = await github.rest.actions.getWorkflowRun({ ...context.repo, run_id: context.runId });
            const { data: latest } = await github.rest.actions.listWorkflowRuns({
              ...context.repo, workflow_id: run.workflow_id, event: context.eventName, branch, per_page: 1,
            });
            if (run.id !== context.runId || run.run_attempt !== attempt || run.head_sha !== sha
              || run.head_branch !== branch || run.event !== context.eventName || run.status !== 'in_progress'
              || latest.workflow_runs[0]?.id !== context.runId || latest.workflow_runs[0]?.run_attempt !== attempt) {
              throw new Error('Obsolete validation run or attempt');
            }
            if (main) {
              const { data } = await github.rest.repos.getBranch({ ...context.repo, branch: 'main' });
              if (data.commit.sha !== sha) throw new Error('Obsolete main revision');
            } else {
              const { data: pr } = await github.rest.pulls.get({ ...context.repo, pull_number: source.number });
              if (pr.state !== 'open' || pr.head.sha !== sha || pr.head.ref !== branch || pr.draft) {
                throw new Error('Obsolete PR revision or unexpected Draft state');
              }
            }
            const { data } = await github.rest.actions.listJobsForWorkflowRunAttempt({
              ...context.repo, run_id: context.runId, attempt_number: attempt, per_page: 100,
            });
            for (const name of applicable) {
              const jobs = data.jobs.filter((job) => job.name === name);
              if (jobs.length !== 1 || jobs[0].status !== 'completed' || jobs[0].conclusion !== 'success'
                || jobs[0].run_id !== context.runId || jobs[0].head_sha !== sha) {
                throw new Error(`Required validation ${name} lacks successful native evidence`);
              }
            }

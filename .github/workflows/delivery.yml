name: Delivery
on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [deploy, rollback]
        required: true
      verification_run:
        description: Successful main Verify run ID (ignored for rollback)
        type: string
        default: '0'
        required: false
      version_id:
        description: Verified Worker Version ID for rollback
        type: string
      receipt_run:
        description: Successful Delivery run containing that version receipt
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: apex-delivery
  cancel-in-progress: false
jobs:
  preflight:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Bind delivery code to verification
        env:
          GH_TOKEN: ${{ github.token }}
          OPERATION: ${{ inputs.operation }}
          VERIFY_RUN_ID: ${{ inputs.verification_run }}
          VERSION_ID: ${{ inputs.version_id }}
          RECEIPT_RUN: ${{ inputs.receipt_run }}
        run: |
          set -euo pipefail
          source .github/scripts/guard.sh
          if [[ "$OPERATION" == deploy ]]; then
            verified_run "$VERIFY_RUN_ID" | jq -e --arg sha "$GITHUB_SHA" '.head_sha == $sha' >/dev/null
          else
            [[ "$OPERATION" == rollback && "$RECEIPT_RUN" =~ ^[0-9]+$ && "$VERSION_ID" =~ ^[a-f0-9-]{32,36}$ ]]
          fi
  deliver:
    needs: preflight
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: apex-operations
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.11
      - run: pnpm install --frozen-lockfile
      - name: Deliver a verified artifact without rebuilding
        run: bash .github/scripts/publish.sh
        env:
          OPERATION: ${{ inputs.operation }}
          VERIFY_RUN_ID: ${{ inputs.verification_run }}
          VERSION_ID: ${{ inputs.version_id }}
          RECEIPT_RUN: ${{ inputs.receipt_run }}
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: delivery-receipt
          path: .delivery/receipt.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

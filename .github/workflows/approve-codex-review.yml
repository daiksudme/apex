name: approve codex review

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: read
  pull-requests: write

defaults:
  run:
    shell: bash

jobs:
  approve:
    if: >-
      github.event.issue.pull_request &&
      github.event.comment.user.login == 'chatgpt-codex-connector[bot]' &&
      startsWith(github.event.comment.body, 'Codex Review: Didn''t find any major issues.')
    runs-on: ubuntu-slim
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.issue.number }}
    steps:
      - name: Verify reviewed commit
        id: review
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          reviewed_commit="$(
            printf '%s\n' "$COMMENT_BODY" |
              sed -n 's/^\*\*Reviewed commit:\*\* `\([0-9a-f]\{7,40\}\)`.*/\1/p' |
              head -n 1
          )"

          if [[ -z "$reviewed_commit" ]]; then
            echo "Could not extract the reviewed commit."
            exit 1
          fi

          if ! resolved_reviewed_sha="$(
            gh api "repos/$GITHUB_REPOSITORY/commits/$reviewed_commit" --jq '.sha'
          )"; then
            echo "Could not uniquely resolve reviewed commit $reviewed_commit."
            exit 1
          fi

          head_sha="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq '.headRefOid')"

          if [[ "$head_sha" != "$resolved_reviewed_sha" ]]; then
            echo "Codex reviewed $resolved_reviewed_sha, but the current HEAD is $head_sha."
            echo "matched=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "matched=true" >> "$GITHUB_OUTPUT"
          echo "reviewed_head=$head_sha" >> "$GITHUB_OUTPUT"

      - name: Check Codex approval reaction
        id: reaction
        if: steps.review.outputs.matched == 'true'
        env:
          COMMENT_CREATED_AT: ${{ github.event.comment.created_at }}
        run: |
          # Codex adds 👍 after the clean-review comment, so allow a short propagation window.
          for attempt in 1 2 3 4 5 6; do
            reaction_ids="$(
              gh api --paginate --method GET "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/reactions" \
                -f content='+1' \
                -F per_page=100 \
                --jq ".[] | select(.user.login == \"chatgpt-codex-connector[bot]\" and .created_at >= \"$COMMENT_CREATED_AT\") | .id"
            )"

            reaction_id=""
            if [[ -n "$reaction_ids" ]]; then
              IFS= read -r reaction_id <<< "$reaction_ids"
            fi

            if [[ -n "$reaction_id" ]]; then
              echo "found=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            if [[ "$attempt" -lt 6 ]]; then
              sleep 5
            fi
          done

          echo "Codex approval reaction was not found."
          echo "found=false" >> "$GITHUB_OUTPUT"

      - name: Approve pull request
        if: steps.reaction.outputs.found == 'true'
        env:
          REVIEWED_HEAD: ${{ steps.review.outputs.reviewed_head }}
        run: |
          head_sha="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq '.headRefOid')"

          if [[ "$head_sha" != "$REVIEWED_HEAD" ]]; then
            echo "PR HEAD changed from $REVIEWED_HEAD to $head_sha after Codex review."
            exit 0
          fi

          owner="${GITHUB_REPOSITORY%%/*}"
          repo="${GITHUB_REPOSITORY#*/}"

          thread_state="$(
            gh api graphql \
              -f owner="$owner" \
              -f name="$repo" \
              -F number="$PR_NUMBER" \
              -f query='
                query($owner: String!, $name: String!, $number: Int!) {
                  repository(owner: $owner, name: $name) {
                    pullRequest(number: $number) {
                      reviewThreads(first: 100) {
                        nodes { isResolved }
                        pageInfo { hasNextPage }
                      }
                    }
                  }
                }
              ' \
              --jq '
                .data.repository.pullRequest.reviewThreads
                | if .pageInfo.hasNextPage then "incomplete"
                  elif any(.nodes[]; .isResolved == false) then "blocking"
                  else "clear"
                  end
              '
          )"

          if [[ "$thread_state" != "clear" ]]; then
            echo "Review threads are not clear: $thread_state."
            exit 0
          fi

          blocking_review_ids="$(
            gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/reviews" \
              --jq ".[] |
                select(
                  .user.login == \"chatgpt-codex-connector[bot]\"
                  or (
                    (.user.login | startswith(\"copilot-pull-request-reviewer\"))
                    and (((.body // \"\") | test(\"unable to review\"; \"i\")) | not)
                  )
                ) |
                .id"
          )"

          if [[ -n "$blocking_review_ids" ]]; then
            echo "Earlier bot review findings exist in the pull request history."
            exit 0
          fi

          head_sha="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq '.headRefOid')"

          if [[ "$head_sha" != "$REVIEWED_HEAD" ]]; then
            echo "PR HEAD changed from $REVIEWED_HEAD to $head_sha before approval."
            exit 0
          fi

          # gh pr review cannot bind an approval to a commit, so use the reviews API here.
          gh api --method POST "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/reviews" \
            -f event=APPROVE \
            -f commit_id="$REVIEWED_HEAD"
